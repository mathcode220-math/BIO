[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-sat-cnf-framework"
version = "1.0.0"
description = "A powerful, domain-agnostic SAT/CNF optimization framework for solving complex constraint satisfaction problems using MaxSAT solvers."
readme = "README.md"
license = { text = "PROPRIETARY - All Rights Reserved" }
authors = [
    { name = "Universal SAT/CNF Framework Team", email = "your-email@example.com" }
]
keywords = ["SAT", "CNF", "MaxSAT", "Optimization", "Constraint Satisfaction", "Solver", "Logic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "pysat>=1.0.0",
    "networkx>=2.6.0",
    "pyyaml>=5.4.0",
    "python-dotenv>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "black>=21.0b0",
    "flake8>=3.9.0",
    "mypy>=0.910",
    "sphinx>=4.0.0",
]
viz = [
    "plotly>=5.0.0",
    "kaleido>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/universal-sat-cnf-framework"
Documentation = "https://github.com/yourusername/universal-sat-cnf-framework#readme"
Repository = "https://github.com/yourusername/universal-sat-cnf-framework.git"
Issues = "https://github.com/yourusername/universal-sat-cnf-framework/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["universal_sat_cnf_framework*"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
